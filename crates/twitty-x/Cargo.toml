[package]
name = "twitty-x"
description = "Twitty's adapter for X's internal web GraphQL API. Translates everything into twitty-model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No doctests in this crate: skip a rustdoc run on every `cargo test`.
[lib]
doctest = false

[[bin]]
name = "twitty-x-cli"
path = "src/bin/twitty-x-cli.rs"

[dependencies]
twitty-model.workspace = true
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
url.workspace = true
regex.workspace = true
html-escape.workspace = true
unicode-properties = { workspace = true, features = ["general-category"] }
uuid.workspace = true
sha2.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
directories.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
wiremock.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
pretty_assertions.workspace = true
proptest.workspace = true
insta.workspace = true

[lints]
workspace = true
