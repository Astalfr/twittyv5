[package]
name = "twitty"
description = "A native X client with an X Pro style deck UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No doctests in this crate: skip a rustdoc run on every `cargo test`.
[lib]
doctest = false

[dependencies]
twitty-model = { workspace = true, features = ["mock"] }
# Only main.rs uses the X adapter; everything else sees `dyn Backend`.
twitty-x.workspace = true
twitty-media.workspace = true
gpui-kit.workspace = true
reqwest_client.workspace = true
image.workspace = true
futures.workspace = true
rodio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
# Updates: GitHub's release API and the installer download (both already
# built for twitty-x), checked against GitHub's SHA-256 digest.
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
directories.workspace = true
keyring.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
unicode-properties.workspace = true

# The sign-in window (see `browser_login`) and the toasts for new tweets (`notifier`).
[target.'cfg(windows)'.dependencies]
wry.workspace = true
tao.workspace = true
windows.workspace = true
windows-registry.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true
ttf-parser.workspace = true
tempfile = "3"
wiremock.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
