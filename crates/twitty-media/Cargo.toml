[package]
name = "twitty-media"
description = "Video decoding for Twitty (Media Foundation on Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No doctests in this crate: skip a rustdoc run on every `cargo test`.
[lib]
doctest = false

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

# The workspace forbids unsafe code, and `forbid` can't be relaxed per module.
# This crate is the one place that talks to COM, so it denies unsafe instead and
# allows it only in `mf` (and the fixture generator). The rest matches the
# workspace table.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
