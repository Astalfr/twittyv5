[package]
name = "twitty-model"
description = "Twitty's stable domain model and Backend port. No I/O, no UI, no X-specific shapes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No doctests in this crate: skip a rustdoc run on every `cargo test`.
[lib]
doctest = false

[features]
