name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main, a cancelled run never saves its cache: let it finish (GitHub keeps
  # at most one pending run per group, so pushes don't pile up).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI: a much smaller target/ to compile, link and cache.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      # Real-time scanning of every file rustc writes slows Windows builds a lot;
      # the runner is thrown away after the job.
      - name: Disable Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      # rustup installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy).
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          # Save what was compiled even if a step failed or timed out, so the
          # next run doesn't start cold again. Only main saves (10 GB quota);
          # pull requests restore main's cache.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        timeout-minutes: 30

      - name: Test
        run: cargo test --workspace --locked
        timeout-minutes: 30

  build:
    name: build twitty.exe
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      # Real-time scanning of every file rustc writes slows Windows builds a lot;
      # the runner is thrown away after the job.
      - name: Disable Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          # Save what was compiled even if a step failed or timed out, so the
          # next run doesn't start cold again. Only main saves (10 GB quota);
          # pull requests restore main's cache.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --release --locked -p twitty
        timeout-minutes: 60

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: twitty-windows-x64-${{ github.sha }}
          path: target/release/twitty.exe
          if-no-files-found: error
          retention-days: 30
