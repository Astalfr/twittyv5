name: CI

on:
  push:
    branches: [main, master]
    # A version tag (v1.2.3) also builds the installer and publishes a GitHub
    # Release (jobs `build` and `release`).
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main, a cancelled run never saves its cache: let it finish (GitHub keeps
  # at most one pending run per group, so pushes don't pile up).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI: a much smaller target/ to compile, link and cache.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # `lint` and `test` run in parallel: clippy only type-checks (rmeta) and
  # shares no artifacts with the test build, so one job running both just
  # added their times. Each keeps its own cache for the same reason.
  lint:
    name: fmt, clippy
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      # Real-time scanning of every file rustc writes slows Windows builds a lot;
      # the runner is thrown away after the job.
      - name: Disable Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      # rustup installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy).
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        run: cargo fmt --all -- --check

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          # Save what was compiled even if a step failed or timed out, so the
          # next run doesn't start cold again. Only main saves (10 GB quota);
          # pull requests restore main's cache.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        timeout-minutes: 30

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Disable Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace --locked
        timeout-minutes: 30

  build:
    name: build installer
    # Only version tags (and manual runs) build the release: the installer is
    # the only thing anyone uses (installed copies update from it), and the
    # release build is the slowest job (~5 min warm, mostly thin LTO + link).
    # No cache: only `main` could save one, and it no longer runs this job.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      # Real-time scanning of every file rustc writes slows Windows builds a lot;
      # the runner is thrown away after the job.
      - name: Disable Defender real-time scanning
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build release
        run: cargo build --release --locked -p twitty
        timeout-minutes: 60

      # Inno Setup may or may not be on the runner image: install it if missing.
      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
            Where-Object name -eq 'twitty' | Select-Object -ExpandProperty version
          & $iscc /Qp "/DAppVersion=$version" installer\twitty.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: twitty-setup-windows-x64-${{ github.sha }}
          path: target/installer/twitty-setup-*.exe
          if-no-files-found: error
          retention-days: 30

  # Publishes the installer of a version tag. Installed copies
  # update from the latest release, so this only runs once tests and build pass.
  release:
    name: publish release
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: twitty-setup-windows-x64-${{ github.sha }}
          path: dist

      # The installer is named after the version in Cargo.toml.
      - name: Check the tag matches the version
        run: |
          installer="dist/twitty-setup-${GITHUB_REF_NAME#v}-x64.exe"
          if [ ! -f "$installer" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml (no $installer)."
            ls dist
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/twitty-setup-*-x64.exe
          --repo "$GITHUB_REPOSITORY"
          --title "Twitty ${GITHUB_REF_NAME#v}"
          --generate-notes
