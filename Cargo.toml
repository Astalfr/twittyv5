[workspace]
resolver = "3"
members = ["crates/twitty", "crates/twitty-media", "crates/twitty-model", "crates/twitty-x"]
default-members = ["crates/twitty"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
twitty-model = { path = "crates/twitty-model" }
twitty-x = { path = "crates/twitty-x" }
twitty-media = { path = "crates/twitty-media" }

# UI. gpui-kit pins the gpui-pre snapshot exactly; every gpui-pre-* crate must
# match it (see docs/development.md before changing these).
gpui-kit = "=0.8.0"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }
# Resampling remote images before GPUI draws them (GPUI already builds both;
# `image` must stay on the 0.25 line GPUI uses, since `RenderImage` takes its `Frame`).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
futures = "0.3"
# The notification sound (mp3) and the sound of videos, decoded by
# twitty-media and played through a rodio mixer (GPUI has no audio).
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
# Video decoding through Media Foundation (twitty-media only). 0.62 is the
# version GPUI already builds, so this adds features, not a second copy.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
] }

# Async / HTTP for the X adapter.
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "brotli", "query"] }

# Data.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
url = { version = "2", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
# x-client-transaction-id (SHA-256 + base64). Both versions are already in
# the build through other crates, so they add no new code.
sha2 = "0.10"
base64 = "0.22"
html-escape = "0.2"
# Finding the emoji drawn with the bundled Twemoji font (grapheme clusters and
# Unicode's emoji properties). GPUI already builds both, so they add no code.
unicode-segmentation = "1.12"
unicode-properties = { version = "0.1.3", default-features = false, features = ["emoji"] }
# Tests only: checks the bundled emoji font (GPUI already builds it).
ttf-parser = "0.25"

# Errors / logging.
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# App plumbing.
clap = { version = "4", features = ["derive"] }
directories = "6"
keyring = { version = "3", features = ["windows-native"] }
# Compiles the exe's icon resource (build script only; GPUI already uses it).
embed-resource = "3"

# Testing.
insta = { version = "1", features = ["json"] }
proptest = "1"
wiremock = "0.6"
pretty_assertions = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
debug = "limited"

# Keep debug builds of the UI smooth (same choice as gpui-component).
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
# Copies every decoded video frame pixel by pixel.
twitty-media = { opt-level = 3 }

[profile.release]
strip = "symbols"
lto = "thin"
